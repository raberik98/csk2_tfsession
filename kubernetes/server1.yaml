apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1
  namespace: infra1
  labels:
    app: server1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server1
  template:
    metadata:
      labels:
        app: server1
    spec:
      containers:
        - name: server1
          image: 362099375729.dkr.ecr.eu-west-1.amazonaws.com/server_1:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server1-service
  namespace: infra1
  labels:
    app: server1
spec:
  type: ClusterIP
  selector:
    app: server1
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP